services:
  postgres:
    image: postgres:16-alpine
    container_name: parcel-research-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: parcel_research
    volumes:
      - parcel_research_pgdata:/var/lib/postgresql/data

volumes:
  parcel_research_pgdata:
