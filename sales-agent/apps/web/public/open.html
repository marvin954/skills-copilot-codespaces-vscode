<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Agent — Open Dashboard</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #020617;
        color: #e2e8f0;
        max-width: 640px;
        margin: 3rem auto;
        padding: 1.5rem;
        line-height: 1.6;
      }
      a {
        color: #818cf8;
        font-weight: 600;
      }
      code {
        background: #1e293b;
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
      }
      .btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;

  <body>
    <h1>Sales Agent Dashboard</h1>
    <p>If the main app does not load, use one of these links:</p>
    <p><a class="btn" href="/">Open dashboard (home)</a></p>
    <p><a href="/leads">Leads</a> · <a href="/deals">Deals</a></p>
    <hr style="border-color: #334155; margin: 2rem 0" />
    <p><strong>On this VM:</strong> port <code>3000</code> (web), <code>4000</code> (API).</p>
    <p>
      <strong>From your computer:</strong> forward port 3000 in Cursor’s
      <em>Ports</em> panel, or open the public URL in
      <code>sales-agent/PUBLIC_URL.txt</code>.
    </p>
